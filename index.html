<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生物特徵解碼器 - 國小自然挑戰賽</title>
    <style>
        :root {
            --primary-green: #2d6a4f;
            --light-green: #d8f3dc;
            --accent-green: #95d5b2;
            --text-dark: #1b4332;
            --bg-color: #f7fff7;
        }

        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background-color: var(--light-green);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            background: white;
            width: 90%;
            max-width: 650px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        .hidden { display: none; }

        h1 { color: var(--primary-green); margin-top: 0; }
        .description { font-size: 1.1rem; line-height: 1.6; margin-bottom: 25px; color: #444; }
        
        .btn {
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #1b4332;
        }

        .btn:active { transform: translateY(4px); box-shadow: none; }

        /* 遊戲進行中樣式 */
        .question-info { font-weight: bold; color: #666; margin-bottom: 10px; font-size: 0.9rem; }
        .target-box {
            background: #f0fff4;
            border: 3px dashed var(--accent-green);
            padding: 25px;
            margin-bottom: 25px;
            font-size: 1.6rem;
            border-radius: 15px;
            color: var(--primary-green);
            font-weight: bold;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            padding: 18px;
            background: white;
            border: 2px solid var(--accent-green);
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
            color: var(--text-dark);
        }

        .option-btn:hover { background: var(--light-green); border-color: var(--primary-green); }

        /* 結算頁面樣式 */
        .result-card { background: #f9f9f9; padding: 20px; border-radius: 15px; margin-top: 20px; }
        .review-container { max-height: 300px; overflow-y: auto; text-align: left; margin-top: 15px; }
        .review-item {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .correct { color: var(--primary-green); font-weight: bold; }
        .wrong { color: #d90429; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 介紹頁 -->
    <div id="start-screen">
        <h1>🌿 生物特徵解碼器</h1>
        <p class="description">
            歡迎挑戰國小四年級自然知識！<br>
            系統將隨機挑選 6 種生物，<br>
            請選出正確的構造或分類特徵。<br>
            <strong>不重複出題機制已啟動。</strong>
        </p>
        <button class="btn" onclick="startGame()">開始任務</button>
    </div>

    <!-- 遊戲進行頁 -->
    <div id="game-screen" class="hidden">
        <div class="question-info">進度：第 <span id="q-count">1</span> / 6 題</div>
        <div class="target-box">
            目標對象：<span id="target-name">載入中...</span>
        </div>
        <p style="color: #666;">請選出符合它的特徵組合：</p>
        <div id="options" class="options-grid"></div>
    </div>

    <!-- 結算頁 -->
    <div id="result-screen" class="hidden">
        <h1>🎉 任務完成！</h1>
        <div class="result-card">
            <h2 id="final-score" style="margin: 0; color: var(--primary-green);">分數：0</h2>

        </div>
        <div id="review-list" class="review-container"></div>
        <br>
        <button class="btn" onclick="startGame()">再挑戰 6 題</button>
    </div>
</div>

        { id: 100, name: "生物多樣性", trait: "豐富的物種有助生態穩定", options: ["豐富的物種有助生態穩定", "全地球只有一種生物", "環境受到嚴重污染"] }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let history = [];

    // --- 核心邏輯：管理題庫與隨機出題 ---
    function getNextBatch() {
        let usedIds = JSON.parse(localStorage.getItem('used_bio_ids') || '[]');
        
        // 若全部出過則重置
        if (usedIds.length >= fullBank.length) {
            alert("恭喜完成 100 題挑戰！題庫將重新洗牌。");
            usedIds = [];
        }

        let available = fullBank.filter(q => !usedIds.includes(q.id));
        available.sort(() => Math.random() - 0.5); // 洗牌
        
        const batch = available.slice(0, 6);
        
        // 儲存已出過的題目 ID
        const newUsed = [...usedIds, ...batch.map(q => q.id)];
        localStorage.setItem('used_bio_ids', JSON.stringify(newUsed));
        
        return batch;
    }

    // --- 遊戲流程控制 ---
    function startGame() {
        currentQuestions = getNextBatch();
        currentIndex = 0;
        score = 0;
        history = [];
        
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        showQuestion();
    }

    function showQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById('q-count').innerText = currentIndex + 1;
        document.getElementById('target-name').innerText = q.name;
        
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        
        // 選項隨機排列
        const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
        
        shuffledOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => handleAnswer(opt, q.trait);
            optionsDiv.appendChild(btn);
        });
    }

    function handleAnswer(selected, correct) {
        const isCorrect = (selected === correct);
        if (isCorrect) score += 100;
        
        history.push({
            name: currentQuestions[currentIndex].name,
            selected: selected,
            correct: correct,
            status: isCorrect
        });

        currentIndex++;
        if (currentIndex < 6) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        const avgScore = score / 6;
        document.getElementById('final-score').innerText = `本次得分：${Math.round(avgScore)}`;
        
        const comment = document.getElementById('score-comment');
        if(avgScore === 100) comment.innerText = "太棒了！你是生物大師！🥇";
        else if(avgScore >= 80) comment.innerText = "非常出色，對生物特徵很了解喔！✨";
        else comment.innerText = "再接再厲，多觀察身邊的生物吧！🌱";

        // 生成回顧清單
        const list = document.getElementById('review-list');
        list.innerHTML = '<h3 style="border-bottom: 2px solid var(--accent-green); padding-bottom: 5px;">題目回顧：</h3>';
        history.forEach(item => {
            const div = document.createElement('div');
            div.className = 'review-item';
            div.innerHTML = `
                <div>
                    <strong>${item.name}</strong><br>
                    <small style="color: #666;">你的選擇: ${item.selected}</small>
                </div>
                <span class="${item.status ? 'correct' : 'wrong'}">
                    ${item.status ? '✓ 正確' : '✗ 正解：' + item.correct}
                </span>
            `;
            list.appendChild(div);
        });
    }
</script>
